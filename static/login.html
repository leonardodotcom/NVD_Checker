<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · NVD Checker · TEXA</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span>
  </div>
  <button type="button" class="icon theme-toggle login-theme-toggle" data-theme-toggle aria-label="Toggle dark mode"><svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <main class="login-shell">
    <img class="login-logo" src="/static/brand/texa-logo-white.svg" alt="TEXA" width="240" height="49">
    <form id="login-form" class="login-card">
      <div>
        <h1>NVD Checker</h1>
        <p class="text-muted">Sign in to monitor vulnerabilities for your projects.</p>
      </div>
      <label class="field-label">Username <input id="username" autocomplete="username" required autofocus></label>
      <label class="field-label">Password <input id="password" type="password" autocomplete="current-password" required></label>
      <div id="login-error" class="alert" role="alert" hidden></div>
      <button type="submit" class="primary">Sign in</button>
    </form>
    <p class="login-foot">Internal tool · data from the U.S. National Vulnerability Database</p>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
